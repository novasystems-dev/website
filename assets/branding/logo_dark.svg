<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dark_planetGrad" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#F2AFB8" />
      <stop offset="45%" stop-color="#EAA2AC" />
      <stop offset="80%" stop-color="#D96E7E" />
      <stop offset="100%" stop-color="#AD4252" />
    </linearGradient>

    <linearGradient id="dark_skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F7E6E8" />
      <stop offset="100%" stop-color="#EAA2AC" />
    </linearGradient>

    <clipPath id="dark_planetClip">
      <circle cx="256" cy="256" r="216" />
    </clipPath>

    <!-- Luminous Rim Glow for Dark Backgrounds -->
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#EDA1AC" flood-opacity="0.4" />
    </filter>

    <filter id="darkTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Circular Outer Guide / Orbit Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#EDA1AC" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Main Spherical Celestial Body with Glow -->
  <g filter="url(#darkGlow)">
    <circle cx="256" cy="256" r="216" fill="url(#dark_planetGrad)" stroke="#110E10" stroke-width="4.5" />

    <g clip-path="url(#dark_planetClip)">
      <path d="M 40,256 C 40,136 136,40 256,40 C 376,40 472,136 472,256 C 400,270 280,210 160,240 C 90,255 50,256 40,256 Z" fill="url(#dark_skyGrad)" opacity="0.95" />

      <!-- Bands -->
      <path d="M 80,105 Q 180,98 300,108 Q 380,114 430,110" stroke="#D96E7E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 120,113 Q 220,107 340,115 T 410,118" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
      <path d="M 95,119 Q 200,112 360,121" stroke="#C95B6A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

      <path d="M 60,132 Q 170,124 290,133 Q 390,138 452,130" stroke="#D96E7E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 90,140 Q 210,131 330,141 Q 400,143 440,138" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />
      <path d="M 75,147 Q 190,139 310,149 T 455,145" stroke="#C95B6A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
      <path d="M 130,154 Q 240,146 370,156" stroke="#D96E7E" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75" />

      <path d="M 48,168 Q 160,158 280,170 Q 380,177 465,166" stroke="#D96E7E" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 70,176 Q 190,167 320,178 Q 410,181 462,174" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
      <path d="M 55,185 Q 175,176 300,188 Q 390,192 468,183" stroke="#C95B6A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

      <path d="M 42,208 Q 160,198 280,210 Q 380,218 470,206" stroke="#D96E7E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 65,217 Q 190,207 330,220 Q 420,224 471,215" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 50,227 Q 180,218 310,230 Q 400,234 472,226" stroke="#C95B6A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65" />
    </g>
  </g>

  <!-- Orbital Loop -->
  <path d="M 85,340 C 120,440 370,440 430,310 C 470,220 380,110 270,140 C 170,170 120,270 200,345 C 260,395 360,360 380,290" 
        fill="none" stroke="#110E10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark "Nova" with strong contrast for dark mode -->
  <g transform="translate(256, 280)">
    <text x="0" y="0" text-anchor="middle"
          font-family="'Playfair Display', 'Noto Serif', 'Nimbus Roman', 'Baskerville', 'Georgia', 'Times New Roman', serif"
          font-size="124" font-style="italic" font-weight="bold"
          fill="#FFFFFF" opacity="0.75" filter="url(#darkTextGlow)">Nova</text>
    <text x="0" y="0" text-anchor="middle"
          font-family="'Playfair Display', 'Noto Serif', 'Nimbus Roman', 'Baskerville', 'Georgia', 'Times New Roman', serif"
          font-size="124" font-style="italic" font-weight="bold"
          fill="#1A1316" opacity="0.92">Nova</text>
  </g>
</svg>