<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDA1AC" />
      <stop offset="40%" stop-color="#E78895" />
      <stop offset="100%" stop-color="#CF5D6E" />
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FCE7F3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="rotate(-13 300 210)" filter="url(#softShadow)">
    <path d="M 90 210 A 210 135 0 0 1 510 210 Z" fill="url(#skyGrad)" stroke="#1E1B2E" stroke-width="4.5" />

    <path d="M 115 185 Q 300 155 485 185" stroke="#E78895" stroke-width="5.5" stroke-dasharray="45 12 25 10 70 15" fill="none" stroke-linecap="round" opacity="0.85" />
    <path d="M 135 160 Q 300 132 465 160" stroke="#CF5D6E" stroke-width="4" stroke-dasharray="35 15 55 12 30 8" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M 170 135 Q 300 110 430 135" stroke="#EDA1AC" stroke-width="4.5" stroke-dasharray="60 14 30 10" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M 210 115 Q 300 95 390 115" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="40 12 25 8" fill="none" stroke-linecap="round" opacity="0.95" />
    <path d="M 250 95 Q 300 85 350 95" stroke="#FCE7F3" stroke-width="2.5" stroke-dasharray="25 8" fill="none" stroke-linecap="round" opacity="0.9" />

    <path d="M 90 210 A 210 135 0 0 0 510 210 Z" fill="url(#planetGrad)" stroke="#1E1B2E" stroke-width="4.5" />

    <path d="M 225 210 C 225 135 395 135 395 210 C 395 285 175 290 165 210 C 155 130 340 125 350 210" 
          fill="none" stroke="#1E1B2E" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <g id="novaWordmark">
    <text x="302" y="254" font-family="'Georgia', 'Playfair Display', serif" font-size="135" font-style="italic" font-weight="bold" fill="rgba(0,0,0,0.12)" text-anchor="middle" letter-spacing="-4">Nova</text>
    <text x="300" y="252" font-family="'Georgia', 'Playfair Display', serif" font-size="135" font-style="italic" font-weight="bold" fill="#1E1B2E" text-anchor="middle" letter-spacing="-4">Nova</text>
  </g>
</svg>